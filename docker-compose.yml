services:
  sdm-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfc-424-dna-backend
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    command: tunnel run --token ${TUNNEL_TOKEN}
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - sdm-backend
